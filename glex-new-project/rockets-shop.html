<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rockets - Glex Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #061221;
      --ink: #e7f2ff;
      --ink-soft: #a9c5df;
      --line: rgba(122, 180, 240, 0.25);
      --panel: rgba(9, 24, 40, 0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(41, 121, 210, 0.35) 0, transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(75, 161, 255, 0.28) 0, transparent 35%),
        var(--bg);
      padding: 1.1rem;
    }

    .shell {
      width: min(1020px, 94vw);
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(10, 27, 46, 0.94), rgba(8, 20, 34, 0.96));
      padding: 1rem;
    }

    h1 {
      font-family: "Syne", sans-serif;
      margin: 0.2rem 0 0.4rem;
      letter-spacing: 0.03em;
    }

    .row {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .pill {
      border: 1px solid rgba(146, 198, 247, 0.4);
      background: rgba(12, 38, 60, 0.7);
      border-radius: 999px;
      padding: 0.38rem 0.78rem;
      font-size: 0.9rem;
      color: #d8ecff;
    }

    .grid {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.7rem;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      padding: 0.8rem;
      display: grid;
      gap: 0.45rem;
    }

    .rocket-preview {
      height: 74px;
      border-radius: 10px;
      border: 1px solid rgba(146, 198, 247, 0.22);
      background: rgba(7, 17, 29, 0.9);
      display: grid;
      place-items: center;
    }

    .shape {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 42px solid var(--rocket-body);
      position: relative;
      transform: rotate(180deg);
    }

    .shape::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 14px;
      width: 12px;
      height: 18px;
      background: var(--rocket-stripe);
    }

    .shape::after {
      content: "";
      position: absolute;
      left: -4px;
      top: -8px;
      width: 8px;
      height: 10px;
      background: var(--rocket-flame);
      border-radius: 0 0 6px 6px;
    }

    .name {
      font-family: "Syne", sans-serif;
      font-size: 1.08rem;
    }

    .actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    button,
    a.btn {
      border: 1px solid rgba(146, 198, 247, 0.46);
      background: rgba(16, 44, 72, 0.72);
      color: #e8f4ff;
      border-radius: 999px;
      padding: 0.46rem 0.82rem;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button.primary,
    a.btn.primary {
      background: linear-gradient(135deg, #2f7ed6, #1c4e8a);
      border-color: rgba(176, 219, 255, 0.7);
    }

    .muted {
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    #msg {
      margin-top: 0.8rem;
      color: #bdddff;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="row">
      <div>
        <p class="muted" style="margin:0; letter-spacing:.14em; text-transform:uppercase;">Glex Games</p>
        <h1>Rockets</h1>
      </div>
      <div class="row" style="justify-content:flex-end;">
        <div class="pill">Stars: <span id="stars">0</span></div>
        <div class="pill">Equipped: <span id="equipped">Starter</span></div>
        <a class="btn primary" href="index.html">Back to Game</a>
      </div>
    </div>

    <p class="muted" style="margin:.2rem 0 0;">Buy rockets with stars, equip your favorite, and it will stay saved after refresh.</p>

    <section class="grid" id="grid"></section>

    <p id="msg"></p>
  </main>

  <script>
    const ROCKETS = [
      { id: "starter", name: "Starter", cost: 0, body: "#dcecff", stripe: "#4fa2ff", flame: "#ffb067" },
      { id: "crimson", name: "Crimson", cost: 12, body: "#ffe1dd", stripe: "#e35454", flame: "#ffc27a" },
      { id: "emerald", name: "Emerald", cost: 16, body: "#e4ffe8", stripe: "#3daf6f", flame: "#ffd178" },
      { id: "shadow", name: "Shadow", cost: 22, body: "#d4dbe6", stripe: "#4d5b73", flame: "#ff9f68" },
      { id: "nova", name: "Nova", cost: 30, body: "#efe6ff", stripe: "#8d67ff", flame: "#ffd07a" }
    ];

    const starsEl = document.getElementById("stars");
    const equippedEl = document.getElementById("equipped");
    const grid = document.getElementById("grid");
    const msg = document.getElementById("msg");

    let stars = 0;
    let owned = ["starter"];
    let equipped = "starter";

    function loadState() {
      try {
        stars = Number(localStorage.getItem("glex-games-stars-wallet") || 0);
        owned = JSON.parse(localStorage.getItem("glex-games-owned-rockets") || "[\"starter\"]");
        equipped = localStorage.getItem("glex-games-equipped-rocket") || "starter";
      } catch {
        stars = 0;
        owned = ["starter"];
        equipped = "starter";
      }

      if (!owned.includes("starter")) owned.push("starter");
      if (!owned.includes(equipped)) equipped = "starter";
    }

    function saveState() {
      localStorage.setItem("glex-games-stars-wallet", String(stars));
      localStorage.setItem("glex-games-owned-rockets", JSON.stringify(owned));
      localStorage.setItem("glex-games-equipped-rocket", equipped);
    }

    function rocketName(id) {
      const r = ROCKETS.find((x) => x.id === id);
      return r ? r.name : "Starter";
    }

    function setMsg(text) {
      msg.textContent = text;
    }

    function buyRocket(id) {
      const r = ROCKETS.find((x) => x.id === id);
      if (!r) return;
      if (owned.includes(id)) {
        setMsg(`${r.name} already owned.`);
        return;
      }
      if (stars < r.cost) {
        setMsg(`Not enough stars for ${r.name}.`);
        return;
      }
      stars -= r.cost;
      owned.push(id);
      setMsg(`Purchased ${r.name}.`);
      saveState();
      render();
    }

    function equipRocket(id) {
      if (!owned.includes(id)) {
        setMsg("You need to buy this rocket first.");
        return;
      }
      equipped = id;
      setMsg(`${rocketName(id)} equipped.`);
      saveState();
      render();
    }

    function render() {
      starsEl.textContent = String(stars);
      equippedEl.textContent = rocketName(equipped);

      grid.innerHTML = "";
      for (const r of ROCKETS) {
        const isOwned = owned.includes(r.id);
        const isEquipped = equipped === r.id;

        const card = document.createElement("article");
        card.className = "card";

        const preview = document.createElement("div");
        preview.className = "rocket-preview";
        const shape = document.createElement("div");
        shape.className = "shape";
        shape.style.setProperty("--rocket-body", r.body);
        shape.style.setProperty("--rocket-stripe", r.stripe);
        shape.style.setProperty("--rocket-flame", r.flame);
        preview.appendChild(shape);

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = r.name;

        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = isOwned ? "Owned" : `Cost: ${r.cost} stars`;

        const actions = document.createElement("div");
        actions.className = "actions";

        const buy = document.createElement("button");
        buy.textContent = isOwned ? "Owned" : "Buy";
        buy.disabled = isOwned;
        buy.addEventListener("click", () => buyRocket(r.id));

        const equip = document.createElement("button");
        equip.textContent = isEquipped ? "Equipped" : "Equip";
        equip.className = isEquipped ? "primary" : "";
        equip.disabled = isEquipped;
        equip.addEventListener("click", () => equipRocket(r.id));

        actions.appendChild(buy);
        actions.appendChild(equip);

        card.appendChild(preview);
        card.appendChild(name);
        card.appendChild(meta);
        card.appendChild(actions);
        grid.appendChild(card);
      }
    }

    loadState();
    saveState();
    render();
  </script>
</body>
</html>
