<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLEX Flight Sim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;font-family:'Space Grotesk',sans-serif;color:#edf6ff;overflow:hidden;background:
      linear-gradient(180deg,rgba(2,10,22,.18) 0%,rgba(2,10,22,.42) 100%),
      url('https://images.unsplash.com/photo-1474302770737-173ee21bab63?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat fixed}
    .veil{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%, rgba(79,161,255,.18), transparent 35%), linear-gradient(180deg, rgba(2,10,22,.12) 0%, rgba(2,10,22,.38) 100%)}
    .wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem;text-align:center}
    .tag{font-family:'Orbitron',sans-serif;letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:#b6d7f3}
    h1{font-family:'Orbitron',sans-serif;font-size:clamp(2.2rem,8vw,5.2rem);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 28px rgba(79,161,255,.55)}
    .sub{max-width:42rem;font-size:1rem;line-height:1.6;color:#c9def0}
    .fly-btn,.back-btn{appearance:none;border:none;border-radius:999px;padding:.9rem 2.5rem;font-family:'Orbitron',sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .fly-btn{background:linear-gradient(135deg,#2f7de2 0%,#0d3c8a 100%);color:#fff;box-shadow:0 12px 28px rgba(21,101,192,.42)}
    .back-btn{background:rgba(10,27,50,.88);color:#d3e8fb;border:1px solid rgba(106,182,255,.28)}
    .row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
    .note{position:fixed;left:50%;bottom:.2rem;transform:translateX(-50%);z-index:3;font-size:.65rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,246,255,.42);pointer-events:none}
  </style>
</head>
<body>
  <div class="veil"></div>
  <main class="wrap">
    <div class="tag">GLEX Flight Sim</div>
    <h1>GLEX Flight Sim</h1>
    <div class="sub">A separate flight-sim path with its own pages. Click Fly to pick a plane, then choose a spawn airport, then enter the world.</div>
    <div class="row">
      <a class="fly-btn" href="flight-select-fresh.html">Fly</a>
    </div>
  </main>
  <div class="note">GLEX Flight Sim</div>
</body>
</html>
