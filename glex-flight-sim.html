<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GELX Flight Sim</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--ink: #e7f4ff;
				--sky: #7ac6ff;
				--sky-2: #1d6ba1;
				--deep: #04182a;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: "Space Grotesk", sans-serif;
				color: var(--ink);
				background:
					linear-gradient(180deg, rgba(2, 12, 20, 0.08) 0%, rgba(2, 12, 20, 0.38) 100%),
					url("https://images.unsplash.com/photo-1474302770737-173ee21bab63?auto=format&fit=crop&w=1800&q=80") center/cover no-repeat;
				position: relative;
				overflow: hidden;
			}

			body::before {
				content: "";
				position: absolute;
				inset: 0;
				background:
					radial-gradient(circle at 18% 14%, rgba(157, 223, 255, 0.45) 0, rgba(157, 223, 255, 0) 38%),
					radial-gradient(circle at 78% 82%, rgba(75, 160, 222, 0.28) 0, rgba(75, 160, 222, 0) 42%);
				pointer-events: none;
			}

			.hero {
				position: relative;
				z-index: 1;
				text-align: center;
				padding: 2rem 1rem;
			}

			.title {
				margin: 0 0 1.2rem;
				font-family: "Orbitron", sans-serif;
				font-size: clamp(2rem, 8vw, 5.2rem);
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: #eff8ff;
				text-shadow: 0 8px 24px rgba(4, 24, 42, 0.6);
			}

			.fly-btn {
				display: inline-block;
				text-decoration: none;
				padding: 0.9rem 2.2rem;
				border-radius: 999px;
				border: 2px solid rgba(196, 231, 255, 0.72);
				background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%);
				color: #f5fbff;
				font-weight: 700;
				font-size: clamp(1rem, 2.3vw, 1.35rem);
				letter-spacing: 0.06em;
				text-transform: uppercase;
				box-shadow: 0 12px 28px rgba(5, 36, 60, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.45);
				transition: transform 170ms ease, box-shadow 170ms ease;
			}

			.fly-btn:hover {
				transform: translateY(-2px) scale(1.01);
				box-shadow: 0 16px 32px rgba(4, 24, 42, 0.64), inset 0 1px 0 rgba(255, 255, 255, 0.5);
			}

			.fly-btn:active {
				transform: translateY(0);
			}

			.fly-btn:focus-visible {
				outline: 3px solid #ffc169;
				outline-offset: 3px;
			}
		</style>
	</head>
	<body>
		<main class="hero">
			<h1 class="title">GELX Flight Sim</h1>
			<a class="fly-btn" href="flight-select.html">Fly</a>
		</main>
	</body>
</html>
